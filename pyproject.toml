[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hath0r-cli"
version = "0.2.0"
description = "HATH0R CLI — operator and developer control plane for the HATHOR agentic framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bayly AI" }]
dependencies = [
  "click>=8.1",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
hath0r = "hath0r_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hath0r_cli = ["py.typed"]
