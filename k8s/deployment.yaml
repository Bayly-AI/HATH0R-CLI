apiVersion: apps/v1
kind: Deployment
metadata:
  name: hathor-cli
  namespace: hathor-cli
  labels:
    app.kubernetes.io/name: hathor-cli
    app.kubernetes.io/managed-by: hath0r
    fargate: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hathor-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hathor-cli
        fargate: "true"
    spec:
      serviceAccountName: hathor-cli-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: hathor-cli
          image: 711387127111.dkr.ecr.us-east-1.amazonaws.com/hathor-cli@sha256:c101c383765dcf2390b327430f22272e386626c15e932ced28936c710106c2cb
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp-volume
          emptyDir: {}
