# BAI Docker group (ATC-oriented template)
# Issue: BAI-CLI #63 (BAI mirror) · Patterned after 1-Nation ATC deploy/docker group
#
# Shared edge: BAI-NGINX | Shared state: BAI-Redis
# Apps profile: atc, mcp, uxp (images must exist locally)
#
#   docker compose -f cfg/docker/groups/hath0r/docker-compose.yml up -d redis nginx
#   docker compose -f cfg/docker/groups/hath0r/docker-compose.yml --profile apps up -d
#
# Secrets: only via env / Development/.credentials/hath0r/.env — never commit.

name: bai

services:
  redis:
    image: redis:7-alpine
    container_name: BAI-Redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hath0r_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      bai-net:
        aliases: [BAI-Redis, redis, bai-redis]
    labels:
      com.hath0r.group: bai
      com.hath0r.component: redis
      com.hath0r.role: shared-state

  nginx:
    image: nginx:1.27-alpine
    container_name: BAI-NGINX
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BAI_NGINX_HOST_PORT:-48000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      bai-net:
        aliases: [BAI-NGINX, nginx, bai-nginx]
    labels:
      com.hath0r.group: bai
      com.hath0r.component: nginx
      com.hath0r.role: shared-edge

  atc:
    profiles: ["apps"]
    image: ${BAI_ATC_IMAGE:-bai/atc:local}
    container_name: BAI-ATC
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_NAME: bai-atc
      REDIS_URL: ${REDIS_URL:-redis://BAI-Redis:6379/0}
      # ATC is config manager for the group
      BAI_GROUP_ROOT: ${BAI_GROUP_ROOT:-/workspace/OpenSource}
    ports:
      - "${BAI_ATC_HOST_PORT:-48081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      bai-net:
        aliases: [BAI-ATC, atc, bai-atc]
    labels:
      com.hath0r.group: bai
      com.hath0r.component: atc
      com.hath0r.role: config-manager

  mcp:
    profiles: ["apps"]
    image: ${BAI_MCP_IMAGE:-bai/mcp:local}
    container_name: BAI-MCP
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_NAME: bai-mcp
      REDIS_URL: ${REDIS_URL:-redis://BAI-Redis:6379/1}
      JEV_MODE: ${JEV_MODE:-off}
    ports:
      - "${BAI_MCP_HOST_PORT:-48080}:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      bai-net:
        aliases: [BAI-MCP, mcp, bai-mcp]
    labels:
      com.hath0r.group: bai
      com.hath0r.component: mcp
      com.hath0r.role: knowledge-mcp

  uxp:
    profiles: ["apps"]
    image: ${BAI_UXP_IMAGE:-bai/uxp:local}
    container_name: BAI-UXP
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
      mcp:
        condition: service_started
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_NAME: bai-uxp
      MCP_BASE_URL: ${MCP_BASE_URL:-http://BAI-MCP:8083}
      REDIS_URL: ${REDIS_URL:-redis://BAI-Redis:6379/2}
    ports:
      - "${BAI_UXP_HOST_PORT:-48082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      bai-net:
        aliases: [BAI-UXP, uxp, bai-uxp]
    labels:
      com.hath0r.group: bai
      com.hath0r.component: uxp
      com.hath0r.role: experience

volumes:
  hath0r_redis_data:
    name: hath0r_redis_data

networks:
  bai-net:
    name: bai-net
