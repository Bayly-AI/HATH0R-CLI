server {
  listen 80;
  server_name _;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Edge routing placeholders — ATC owns final route map in real deploys
  location /mcp/ {
    proxy_pass http://HATH0R-MCP:8083/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /atc/ {
    proxy_pass http://HATH0R-ATC:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Arize Phoenix Telemetry & UI
  location /phoenix/ {
    proxy_pass http://HATH0R-Phoenix:6006/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1/traces {
    proxy_pass http://HATH0R-Phoenix:6006/v1/traces;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /v1/metrics {
    proxy_pass http://HATH0R-Phoenix:6006/v1/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /otlp/ {
    proxy_pass http://HATH0R-Phoenix:6006/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://HATH0R-UXP:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
