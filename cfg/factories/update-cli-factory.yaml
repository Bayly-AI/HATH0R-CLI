# Hath0r Factory Specification v1
# Group: hath0r-opensource
# Factory: update-cli-factory

factory_id: update-cli-factory
name: CLI Update, Validation, Knowledge Share & Release Factory
version: 1.0.0
description: >
  Autonomous factory that runs when updating the CLI. Validates changes, updates
  documentation, shares knowledge (local MemoryGraph and MCP), builds and validates
  packaging, orients sibling repositories to the latest CLI version, opens a governed PR,
  and announces task completion.

author: Bayly-AI
category: governance-and-automation

# Orchestrated micro-bots participating in this factory
bots:
  - id: preflight-bot
    name: Preflight Bot
    role: pre-validation
    description: Verifies repository health, branch governance, and clean tree state.
    capabilities:
      - check-repo-clean
      - validate-branch

  - id: quality-gate-bot
    name: Quality Gate Bot
    role: quality-enforcement
    description: Executes automated unit tests, linting, and quality gate checks.
    capabilities:
      - run-tests
      - check-quality-gate

  - id: doc-refactor-bot
    name: Documentation Refactor Bot
    role: documentation-maintenance
    description: Updates README, TECH_README, and changelog with recent capabilities.
    capabilities:
      - refactor-readme
      - scaffold-tech-readme

  - id: knowledge-organizer-bot
    name: Knowledge Organizer Bot
    role: knowledge-synchronization
    description: Organizes local knowledge assets, publishes to canonical KB, and syncs MCP.
    capabilities:
      - sync-kb
      - publish-mcp

  - id: tri-graph-ingest-bot
    name: Tri-Graph Ingestion Bot
    role: graph-compilation
    description: Compiles KnowledgeGraph and ingests updated documentation into MemoryGraph.
    capabilities:
      - compile-knowledge-graph
      - ingest-memory-graph

  - id: version-bot
    name: Version Bot
    role: semver-management
    description: Enforces SemVer bump and validates version consistency.
    capabilities:
      - ensure-version
      - enforce-version

  - id: release-bot
    name: Release Bot
    role: packaging-and-release
    description: Validates build wheel, package metadata, and release notes.
    capabilities:
      - validate
      - notes

  - id: git-pr-bot
    name: Git PR Bot
    role: pull-request-lifecycle
    description: Opens governed pull request targeting development.
    capabilities:
      - create-pr
      - verify-checks

  - id: task-announcer-bot
    name: Task Announcer Bot
    role: completion-announcement
    description: Emits spoken and telemetry notifications upon successful CLI update.
    capabilities:
      - announce

# Sequential and orchestrated workflows
workflows:
  - id: update-cli
    name: Execute Full CLI Update Pipeline
    description: End-to-end update workflow for HATH0R-CLI validating code, docs, knowledge, packaging, and PR.
    steps:
      - bot: preflight-bot
        action: check-repo-clean
      - bot: quality-gate-bot
        action: run-tests
      - bot: version-bot
        action: ensure-version
      - bot: doc-refactor-bot
        action: refactor-readme
      - bot: doc-refactor-bot
        action: scaffold-tech-readme
      - bot: tri-graph-ingest-bot
        action: compile-knowledge-graph
      - bot: tri-graph-ingest-bot
        action: ingest-memory-graph
      - bot: knowledge-organizer-bot
        action: sync-kb
        on_failure: continue
      - bot: release-bot
        action: validate
      - bot: git-pr-bot
        action: create-pr
        args:
          base: development
      - bot: task-announcer-bot
        action: announce
        args:
          message: "CLI update pipeline completed successfully with full validation, knowledge sync, and PR creation."
