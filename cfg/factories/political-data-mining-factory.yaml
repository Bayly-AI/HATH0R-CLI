# Hath0r Factory Specification v1
# Generated by Factory Manager bot

factory_id: political-data-mining-factory
name: Political Data Mining Factory
version: 1.0.0
description: Factory and bots to mine political data and ensure compliance.
author: Bayly-AI
category: automation
bots:
- id: factory-manager-bot
  name: Factory Manager Bot
  role: factory-lifecycle
  capabilities:
  - list
  - create
  - update
  - delete
  - validate
  - execute
- id: data-miner-bot
  name: Political Data Miner Bot
  role: data-ingestion
  capabilities:
  - mine-political-data
  - gather-historic-data
  - ensure-completeness
  - ingest-legislative-recordset
  - show-statistics
- id: compliance-bot
  name: Compliance Bot
  role: data-compliance
  capabilities:
  - run-compliance-checks
  - validate-schema
workflows:
- id: ingest-and-validate-political-data
  name: Ingest and Validate Political Data
  description: Workflow to mine historical data for the timeframe 1961 to 1981, verify completeness against the compliance schema, and ingest into the platform.
  steps:
  - bot: data-miner-bot
    action: mine-political-data
    on_failure: abort
  - bot: data-miner-bot
    action: gather-historic-data
    on_failure: abort
  - bot: data-miner-bot
    action: ensure-completeness
    on_failure: abort
  - bot: compliance-bot
    action: run-compliance-checks
    on_failure: abort
  - bot: data-miner-bot
    action: ingest-legislative-recordset
    on_failure: abort
  - bot: data-miner-bot
    action: show-statistics
    on_failure: abort
