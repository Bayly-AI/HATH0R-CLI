name: Publish HATH0R VS Code Plugin to Marketplace

on:
  release:
    types: [created]
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/vscode-extension/**"
      - "scripts/build_vscode_plugin.py"
      - ".github/workflows/vscode-marketplace.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: packages/vscode-extension/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The extension's CLI bridge test shells out to `python3 -m src.hath0r_cli.cli`.
      - name: Install HATH0R CLI
        run: python -m pip install -e .

      # Compiles TypeScript to dist/, runs the extension tests, packages with vsce
      # (fails if dist/extension.js is missing) and exports vsix_name / vsix_path.
      - name: Build, test and package VS Code extension
        id: build
        run: python3 scripts/build_vscode_plugin.py

      - name: Install @vscode/vsce & ovsx CLI
        if: github.event_name != 'pull_request'
        run: npm install -g @vscode/vsce ovsx

      - name: Publish to Visual Studio Marketplace
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$VSCE_PAT" ]; then
            vsce publish -p "$VSCE_PAT" --packagePath "${{ steps.build.outputs.vsix_path }}"
          else
            echo "::warning title=VS Code Marketplace::VSCE_PAT secret not configured; ${{ steps.build.outputs.vsix_name }} was built but not published."
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$OVSX_PAT" ]; then
            ovsx publish "${{ steps.build.outputs.vsix_path }}" -p "$OVSX_PAT"
          else
            echo "::warning title=Open VSX::OVSX_PAT secret not configured; ${{ steps.build.outputs.vsix_name }} was built but not published."
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hath0r-vscode-vsix
          path: ${{ steps.build.outputs.vsix_path }}
