name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Checkout Framework contracts (schemas)
        uses: actions/checkout@v4
        with:
          repository: Bayly-AI/HATH0R-Agentic-Framework
          path: hath0r-framework
          sparse-checkout: |
            lib/schemas
            lib/contracts
          sparse-checkout-cone-mode: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy ruff

      - name: Pytest
        env:
          HATH0R_FRAMEWORK_ROOT: ${{ github.workspace }}/hath0r-framework
        run: python -m pytest -q --tb=short

      - name: Type check
        run: mypy src/hath0r_cli --ignore-missing-imports

      - name: Lint
        run: ruff check src/ tests/

      - name: Validate contract fixtures
        env:
          HATH0R_FRAMEWORK_ROOT: ${{ github.workspace }}/hath0r-framework
        run: python -m pytest tests/contract/ -q --tb=short
