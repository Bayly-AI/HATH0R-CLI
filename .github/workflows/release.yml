# Build release artifacts for hath0r-cli (issue #30).
# Triggers: version tags (v*) or manual workflow_dispatch.
# Publishes GitHub Release assets; PyPI/TestPyPI only when secrets are configured.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (Trusted Publisher env pypi, or PYPI_API_TOKEN)"
        type: boolean
        default: false
      publish_test_pypi:
        description: "Publish to TestPyPI (Trusted Publisher env test-pypi, or TEST_PYPI_API_TOKEN)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-artifacts:
    name: python-sdist-wheel-fileset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      # Full checkout: the release checks import hath0r_cli.bots, which needs hath0r_engine.
      - name: Checkout Framework (hath0r_engine + contracts)
        uses: actions/checkout@v4
        with:
          repository: Bayly-AI/HATH0R-Agentic-Framework
          ref: development
          path: hath0r-framework

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,release]"
          pip install -e ./hath0r-framework

      - name: Verify canonical release rotation & SemVer alignment (CR-RELEASE-ROTATION-001)
        run: |
          hath0r release rotate --no-sync-framework
          hath0r release validate

      - name: Build sdist and wheel
        run: python -m build

      - name: Build fileset
        env:
          HATH0R_FRAMEWORK_ROOT: ${{ github.workspace }}/hath0r-framework
        run: |
          python scripts/build_fileset.py --out dist/fileset
          cp scripts/install_hath0r.py dist/install_hath0r.py
          # release rotate moves release/mac/* into release/previous/, so read the committed copy.
          git show HEAD:release/mac/install-wizard.sh > dist/install-wizard.sh
          chmod +x dist/install-wizard.sh
          shasum -a 256 dist/install_hath0r.py > dist/install_hath0r.py.sha256
          shasum -a 256 dist/install-wizard.sh > dist/install-wizard.sh.sha256

      - name: Upload python + fileset artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-and-fileset
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/install_hath0r.py*
            dist/install-wizard.sh*
            dist/fileset/*

  binary:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux
          - os: macos-latest
            tag: darwin
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      # hath0r_cli.bots imports hath0r_engine, so the frozen binary (and the install-wizard
      # command used below) need the framework installed, as in ci.yml.
      - name: Checkout Framework (hath0r_engine)
        uses: actions/checkout@v4
        with:
          repository: Bayly-AI/HATH0R-Agentic-Framework
          ref: development
          path: hath0r-framework

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,release]"
          pip install -e ./hath0r-framework

      - name: Build binary
        run: |
          python scripts/build_binary.py --out dist/binary
          if [ "${{ matrix.tag }}" = "darwin" ]; then
            hath0r install-wizard package --target dmg --out-dir dist/binary
          fi
          if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            hath0r install-wizard package --target exe --out-dir dist/binary
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.tag }}
          path: |
            dist/binary/hath0r-*
            dist/binary/Hath0r-Install-Wizard*

  publish-github-release:
    name: github-release
    needs: [python-artifacts, binary]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          mkdir -p upload
          find release-assets -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name 'hath0r-*' -o -name 'Hath0r-Install-Wizard*' -o -name 'install_hath0r.py*' -o -name 'install-wizard.sh*' -o -name '*.sha256' \) -exec cp {} upload/ \;
          ls -la upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
          body: |
            ## HATH0R CLI + MCP Release

            ### Recommended: Full Install Wizard (CLI + Docker MCP)
            - **macOS Disk Image (`.dmg`)**: Download `Hath0r-Install-Wizard.dmg` (or `Hath0r-Install-Wizard-<ver>-macos.dmg`), mount it, and launch **`Hath0r Install Wizard.app`**.
            - **Windows Executable (`.exe`)**: Download `Hath0r-Install-Wizard.exe` (or `Hath0r-Install-Wizard-<ver>-windows-x64.exe`) and launch it.
            - **Cross-Platform Python / Shell**: Download `install_hath0r.py` (or `install-wizard.sh`), verify its `.sha256` checksum, and run:
            ```sh
            python3 install_hath0r.py
            # or post-install:
            hath0r install-wizard run
            ```

            ### Install options:
            - **macOS Install Wizard DMG**: `Hath0r-Install-Wizard.dmg` (+ `.sha256`)
            - **Windows Install Wizard EXE**: `Hath0r-Install-Wizard.exe` (+ `.sha256`)
            - **Install Wizard Script (CLI + Hath0r-MCP via Docker)**: `python3 install_hath0r.py` / `./install-wizard.sh`
            - **PyPI / pipx**: `pipx install hath0r-cli && hath0r install-wizard run`
            - **Wheel/sdist**: attached assets
            - **Standalone binary**: `hath0r-<ver>-<platform>` (+ `.sha256`)
            - **Fileset**: `hath0r-fileset-<ver>.tar.gz` (+ `.sha256`)

            Verify checksums before use. Do not install via unverified `curl | sh`.

            See `docs/hathor-guide-047-install-and-release-20260918.md`.

  publish-test-pypi:
    name: publish-test-pypi
    needs: [python-artifacts]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test_pypi == true
    environment: test-pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-and-fileset
          path: dist

      - name: Normalize packages dir
        run: |
          set -euo pipefail
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) ! -name 'hath0r-fileset*' -exec cp -n {} upload/ \; || true
          ls -la upload
          test -n "$(ls -A upload 2>/dev/null)" || { echo "No wheel/sdist found"; exit 1; }

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
          skip-existing: true

  publish-pypi:
    name: publish-pypi
    needs: [python-artifacts]
    runs-on: ubuntu-latest
    # Opt-in only — avoids failed tag builds when credentials are unset.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-and-fileset
          path: dist

      - name: Normalize packages dir
        run: |
          set -euo pipefail
          mkdir -p upload
          # Artifacts may nest wheels under subdirs; publish only wheel/sdist.
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) ! -name 'hath0r-fileset*' -exec cp -n {} upload/ \; || true
          ls -la upload
          test -n "$(ls -A upload 2>/dev/null)" || { echo "No wheel/sdist found"; exit 1; }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
          skip-existing: true
          # API token if configured; otherwise OIDC trusted publishing (id-token: write).
          password: ${{ secrets.PYPI_API_TOKEN }}
